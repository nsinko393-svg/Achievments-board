<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12161f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Achievement Board — конструктор роадмепів</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ======================= ВЕРХНЯ ПАНЕЛЬ ======================= -->
  <header id="topbar">
    <div class="tb-group">
      <div class="brand"><span class="brand-ico">🏆</span><span class="brand-txt">ACHIEVEMENT<br>BOARD</span></div>
      <input id="boardName" class="board-name" type="text" value="Мій роадмеп" spellcheck="false" title="Назва дошки">
    </div>

    <div class="tb-group tb-center">
      <div class="search-wrap">
        <span class="search-ico">🔎</span>
        <input id="search" type="text" placeholder="Пошук ачівки…" spellcheck="false">
        <button id="searchClear" class="mini-x" title="Очистити">✕</button>
      </div>
      <button id="btnFilter" class="tb-btn" title="Фільтр за категоріями">⛭ Фільтр</button>

      <!-- SLOT: сюди додавай свої кнопки центральної частини верхньої панелі -->
    </div>

    <div class="tb-group tb-right">
      <div id="progressChip" class="chip" title="Отримані ачівки">
        <span class="chip-bar"><i></i></span><span class="chip-txt">0/0</span>
      </div>
      <button id="btnUndo" class="tb-btn icon" data-m="Відмінити" title="Відмінити (Ctrl+Z)">↶</button>
      <button id="btnRedo" class="tb-btn icon" data-m="Повторити" title="Повторити (Ctrl+Shift+Z)">↷</button>
      <span class="sep"></span>
      <button id="btnExport" class="tb-btn icon" data-m="Експорт у JSON" title="Експорт у JSON">⭳</button>
      <button id="btnImport" class="tb-btn icon" data-m="Імпорт з JSON" title="Імпорт з JSON">⭱</button>
      <button id="btnClear" class="tb-btn icon" data-m="Очистити дошку" title="Очистити дошку">🗑</button>
      <span class="sep"></span>
      <button id="btnTheme" class="tb-btn icon" data-m="Змінити тему" title="Тема">◐</button>
      <button id="btnHelp" class="tb-btn icon" data-m="Керування" title="Гарячі клавіші">?</button>
      <span id="saveState" class="save-state">збережено</span>

      <!-- SLOT: сюди додавай свої кнопки правої частини верхньої панелі -->
    </div>

    <!-- видима лише на вузьких екранах: чіп прогресу переїжджає сюди з JS -->
    <div class="tb-group tb-mobile" id="tbMobile">
      <button id="btnSearchM" class="tb-btn icon" title="Пошук і фільтр">🔎</button>
      <button id="btnMore" class="tb-btn icon" title="Меню">⋯</button>
    </div>
  </header>

  <!-- ======================= ЛІВА ПАНЕЛЬ ======================= -->
  <aside id="leftbar">
    <!-- активні інструменти -->
    <button class="tool" data-tool="select" title="Вибір / переміщення (V)">▣</button>
    <button class="tool" data-tool="hand"   title="Рука — рух полем (H)">✋</button>
    <button class="tool" data-tool="add"    title="Нова ачівка (A)">◉</button>
    <button class="tool" data-tool="link"   title="Зв'язок-стрілка (C)">⤳</button>

    <div class="tool-div"></div>

    <!-- зарезервовані слоти під майбутні інструменти -->
    <button class="tool soon" data-soon="Текст"    title="Текст (заготовка)">T</button>
    <button class="tool soon" data-soon="Стікер"   title="Стікер (заготовка)">▤</button>
    <button class="tool soon" data-soon="Фрейм"    title="Фрейм (заготовка)">⬚</button>
    <button class="tool soon" data-soon="Зображення" title="Зображення (заготовка)">🖼</button>

    <div class="tool-div"></div>
    <button id="btnFit" class="tool" title="Показати все (F)">⤢</button>

    <!-- SLOT: додавай нові інструменти тут (див. TOOLS в app.js) -->
  </aside>

  <!-- ======================= ПОЛЕ ======================= -->
  <main id="viewport">
    <div id="canvas">
      <div id="world">
        <svg id="edges" width="1" height="1">
          <defs>
            <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0,0 L9,4.5 L0,9 z" class="ah"/>
            </marker>
            <marker id="ah-sel" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0,0 L10,5 L0,10 z" class="ah-sel"/>
            </marker>
          </defs>
          <g id="edgeLayer"></g>
          <g id="tempLayer"></g>
        </svg>
        <div id="nodes"></div>
      </div>

      <div id="marquee" hidden></div>
    </div>

    <div id="hint">ПКМ (або <b>H</b>) — рух полем · колесо — зум · 2× клік — нова ачівка · тягни <b>+</b> з кружечка — стрілка</div>
    <div id="hintTouch">Тягни — рух полем · двома пальцями — зум · подвійний тап — нова ачівка · довгий тап — меню</div>

    <div id="zoomHud">
      <button data-z="out" title="Зменшити">−</button>
      <button id="zoomVal" data-z="reset" title="100%">100%</button>
      <button data-z="in" title="Збільшити">+</button>
    </div>

    <div id="filterPop" hidden></div>
    <div id="ctxmenu" hidden></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>
<input id="fileInput" type="file" accept="application/json" hidden>

<!-- шаблон ачівки -->
<template id="tplNode">
  <div class="node">
    <div class="orb">
      <div class="orb-face">
        <span class="orb-icon">⭐</span>
      </div>
      <div class="orb-badge">✓</div>
      <button class="handle h-t" data-h="t" title="Тягни, щоб створити стрілку">+</button>
      <button class="handle h-r" data-h="r" title="Тягни, щоб створити стрілку">+</button>
      <button class="handle h-b" data-h="b" title="Тягни, щоб створити стрілку">+</button>
      <button class="handle h-l" data-h="l" title="Тягни, щоб створити стрілку">+</button>
    </div>
    <div class="node-label">Назва</div>
    <div class="node-meta"></div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
